<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Bus Reservation • Login</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
    }

    body {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, #0f172a, #1d4ed8);
      padding: 16px;
    }

    .login-container {
      background: rgba(15, 23, 42, 0.98);
      color: #e5e7eb;
      width: 100%;
      max-width: 420px;
      border-radius: 20px;
      padding: 28px 24px 24px;
      box-shadow:
        0 18px 45px rgba(15, 23, 42, 0.7),
        0 0 0 1px rgba(148, 163, 184, 0.2);
      backdrop-filter: blur(10px);
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      margin-bottom: 18px;
    }

    .brand-logo {
      width: 38px;
      height: 38px;
      border-radius: 999px;
      background: radial-gradient(circle at 30% 20%, #facc15, #ef4444);
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 20px;
    }

    .brand-text-main {
      font-size: 18px;
      font-weight: 600;
    }

    .brand-text-sub {
      font-size: 11px;
      color: #9ca3af;
      margin-top: 2px;
    }

    h2 {
      font-size: 22px;
      margin-bottom: 4px;
      font-weight: 600;
    }

    .subtitle {
      font-size: 12px;
      color: #9ca3af;
      margin-bottom: 18px;
    }

    form {
      margin-top: 8px;
    }

    .field {
      margin-bottom: 14px;
    }

    label {
      display: block;
      font-size: 12px;
      margin-bottom: 4px;
      color: #d1d5db;
    }

    input {
      width: 100%;
      padding: 9px 11px;
      border-radius: 10px;
      border: 1px solid #4b5563;
      background: rgba(15, 23, 42, 0.9);
      color: #e5e7eb;
      font-size: 13px;
      outline: none;
      transition: border 0.18s ease, box-shadow 0.18s ease, background 0.18s ease;
    }

    input::placeholder {
      color: #6b7280;
      font-size: 12px;
    }

    input:focus {
      border-color: #3b82f6;
      box-shadow: 0 0 0 1px rgba(59, 130, 246, 0.7);
      background: rgba(15, 23, 42, 1);
    }

    .btn-primary {
      width: 100%;
      margin-top: 8px;
      padding: 10px 14px;
      border-radius: 999px;
      border: none;
      font-size: 14px;
      font-weight: 600;
      cursor: pointer;
      background: linear-gradient(135deg, #22c55e, #2563eb);
      color: white;
      letter-spacing: 0.02em;
      box-shadow: 0 12px 25px rgba(37, 99, 235, 0.45);
      transition: transform 0.12s ease, box-shadow 0.12s ease, filter 0.12s ease;
    }

    .btn-primary:hover {
      transform: translateY(-1px);
      box-shadow: 0 16px 32px rgba(37, 99, 235, 0.6);
      filter: brightness(1.05);
    }

    .btn-primary:active {
      transform: translateY(0);
      box-shadow: 0 10px 20px rgba(37, 99, 235, 0.4);
      filter: brightness(0.96);
    }

    .bottom-text {
      margin-top: 14px;
      font-size: 12px;
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 8px;
      flex-wrap: wrap;
      color: #9ca3af;
    }

    .bottom-text a {
      color: #60a5fa;
      text-decoration: none;
      font-weight: 500;
    }

    .bottom-text a:hover {
      text-decoration: underline;
    }

    .error {
      margin-top: 8px;
      font-size: 12px;
      color: #fca5a5;
      display: none;
    }

    @media (max-width: 480px) {
      .login-container {
        padding: 22px 18px 18px;
        border-radius: 18px;
      }

      h2 {
        font-size: 20px;
      }

      .brand-text-main {
        font-size: 16px;
      }
    }
  </style>
</head>
<body>
  <div class="login-container">
    <div class="brand">
      <div class="brand-logo">🚌</div>
      <div>
        <div class="brand-text-main">Bus Reservation</div>
        <div class="brand-text-sub">Welcome back! Login to continue</div>
      </div>
    </div>

    <h2>Login</h2>
    <p class="subtitle">Use the same email & password you used for signup.</p>

    <form id="loginForm">
      <div class="field">
        <label for="email">Email address</label>
        <input
          type="email"
          id="email"
          placeholder="you@example.com"
          required
        />
      </div>

      <div class="field">
        <label for="password">Password</label>
        <input
          type="password"
          id="password"
          placeholder="Enter your password"
          required
        />
      </div>

      <button type="submit" class="btn-primary">
        Login
      </button>

      <p id="errorMsg" class="error">Invalid email or password. Please try again.</p>

      <div class="bottom-text">
        <span>Don't have an account?</span>
        <a href="signup.html">Create one</a>
      </div>
    </form>
  </div>

  <script>
    document.getElementById("loginForm").addEventListener("submit", function (e) {
      e.preventDefault();

      const email = document.getElementById("email").value.trim();
      const password = document.getElementById("password").value;

      const errorMsg = document.getElementById("errorMsg");
      errorMsg.style.display = "none";

      // Read users from localStorage (same key as signup page)
      const users = JSON.parse(localStorage.getItem("users") || "[]");

      // Find a matching user
      const user = users.find(u => u.email === email && u.password === password);

      if (!user) {
        // No matching user
        errorMsg.style.display = "block";
        return;
      }

      // Optional: store logged-in user info
      localStorage.setItem("loggedInUser", JSON.stringify(user));

      alert("Login successful! Redirecting to home page...");
      // TODO: change this to your main page name, e.g. index.html / home.html
      window.location.href = "rohit.html";
    });
  </script>
</body>
</html>
