<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Passenger Details</title>
  <link rel="stylesheet" href="ranjit.css">

  <style>
    body {
      animation: fadeIn 0.8s ease-in-out;
    }

    @keyframes fadeIn {
      from { opacity: 0; transform: translateY(20px); }
      to { opacity: 1; transform: translateY(0); }
    }

    .form-card {
      max-width: 600px;
      margin: 60px auto;
      background: rgba(255,255,255,0.07);
      backdrop-filter: blur(12px);
      padding: 28px 35px;
      border-radius: 18px;
      border: 1px solid rgba(255,255,255,0.15);
      box-shadow: 0 0 25px rgba(0,0,0,0.5);
      animation: cardFloat 1s ease-in-out;
    }

    @keyframes cardFloat {
      0% { transform: translateY(25px); opacity: 0; }
      100% { transform: translateY(0); opacity: 1; }
    }

    .form-card h2 {
      text-align: center;
      margin-bottom: 8px;
      font-size: 25px;
      font-weight: 700;
    }

    .sub-info {
      text-align: center;
      font-size: 14px;
      margin-bottom: 18px;
      opacity: .8;
    }

    .input-field {
      margin-bottom: 18px;
    }

    .input-field input,
    .input-field select {
      width: 100%;
      padding: 12px;
      border-radius: 10px;
      border: 1px solid rgba(255,255,255,0.25);
      background: rgba(255,255,255,0.05);
      color: var(--text);
      font-size: 15px;
      transition: 0.25s;
    }

    .input-field input:focus,
    .input-field select:focus {
      border-color: var(--primary);
      box-shadow: 0 0 10px var(--primary);
    }

    .btn.primary {
      width: 100%;
      padding: 12px;
      font-size: 16px;
      border-radius: 10px;
      margin-top: 10px;
      transition: 0.3s ease;
    }

    .btn.primary:hover {
      transform: scale(1.03);
      box-shadow: 0 0 12px var(--primary);
    }
  </style>
</head>

<body>
  <script type="module">
  import { auth } from "./firebase.js";
  import { onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      // ❌ user not logged in → send to login page
      window.location.href = "login.html";
    }
  });
</script>


<header>
  <div class="nav">
    <div class="brand"><span class="logo">🚌</span> Passenger Details</div>
  </div>
</header>

<div class="form-card">

  <h2>Enter Passenger Details</h2>
  <div class="sub-info" id="busInfo"></div>
  <div class="sub-info" id="seatInfo"></div>
  <div id="passengerForms"></div>
    <button class="btn primary" id="proceedBtn">Proceed </button>
</div>
  

<script>
  const bus = JSON.parse(localStorage.getItem("selectedBus"));
  const seats = JSON.parse(localStorage.getItem("selectedSeats"));
  const date = localStorage.getItem("searchDate");

  document.getElementById("busInfo").innerText =
    `${bus.operator} | ${bus.from} → ${bus.to} | ${date}`;

  document.getElementById("seatInfo").innerText =
    `Seats Selected: ${seats.join(", ")} | ₹${bus.price * seats.length}`;

  const container = document.getElementById("passengerForms");
  

  seats.forEach((seat, index) => {
    const form = document.createElement("div");
    form.className = "passenger-box";
    form.innerHTML = `
      <h3>Passenger ${index + 1} (${seat})</h3>

      <div class="input-field">
        <input type="text" class="pName" placeholder="Full Name">
      </div>

      <div class="input-field">
        <input type="number" class="pAge" placeholder="Age">
      </div>

      <div class="input-field">
        <select class="pGender">
          <option value="">Select Gender</option>
          <option>Male</option>
          <option>Female</option>
          <option>Other</option>
        </select>
      </div>

      <div class="input-field">
        <input type="tel" class="pPhone" placeholder="+91 XXXXXXXXXX" maxlength="14">
      </div>
    `;
    container.appendChild(form);
  });
  // ⭐ Apply +91 prefix and limit to 10 digits
function setupPhoneFormatting() {
  document.querySelectorAll(".pPhone").forEach(input => {

    // Set default prefix
    input.value = "+91 ";

    input.addEventListener("input", function(e) {

      // Prevent removal of +91
      if (!this.value.startsWith("+91 ")) {
        this.value = "+91 ";
      }

      // Extract only digits AFTER +91
      let digits = this.value.replace("+91 ", "").replace(/\D/g, "");

      // Limit to 10 digits
      digits = digits.substring(0, 10);

      // Rebuild final clean value
      this.value = "+91 " + digits;
    });

    // Prevent backspace removing +91
    input.addEventListener("keydown", function(e) {
      if (this.selectionStart <= 4 && (e.key === "Backspace" || e.key === "Delete")) {
        e.preventDefault();
      }
    });

  });
}


setupPhoneFormatting();


  document.getElementById("proceedBtn").onclick = () => {

    const names = [...document.querySelectorAll(".pName")].map(i => i.value.trim());
    const ages = [...document.querySelectorAll(".pAge")].map(i => i.value.trim());
    const genders = [...document.querySelectorAll(".pGender")].map(i => i.value.trim());
    const phones = [...document.querySelectorAll(".pPhone")].map(i => i.value.trim());

    for (let i = 0; i < seats.length; i++) {
      if (!names[i] || !ages[i] || !genders[i] || phones[i].length !== 14) {
  alert("⚠ Enter a valid 10-digit phone number for Passenger " + (i+1));
  return;
}

    }

    localStorage.setItem("passengerNames", JSON.stringify(names));
    localStorage.setItem("passengerAges", JSON.stringify(ages));
    localStorage.setItem("passengerGenders", JSON.stringify(genders));
    localStorage.setItem("passengerPhones", JSON.stringify(phones));

    window.location.href = "payment.html";
  };
</script>


</body>
</html>
