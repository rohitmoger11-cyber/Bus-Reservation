<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Your Ticket</title>
<link rel="stylesheet" href="ranjit.css">

<style>
body {
  background: linear-gradient(135deg, #0b122d, #071a3d, #0a2454);
  min-height: 100vh;
  padding: 40px 10px;
  animation: fadeIn .6s ease-in-out;
  overflow-y: auto; /* allow scrolling */
}


@keyframes fadeIn {
  from { opacity:0; transform: translateY(15px); }
  to { opacity:1; transform: translateY(0); }
}

.ticket-card {
  width: 75%;
  max-width: 750px;
  background: rgba(255,255,255,0.08);
  border-radius: 18px;
  border:1px solid rgba(255,255,255,0.2);
  padding: 25px 35px;
  backdrop-filter: blur(12px);
  box-shadow: 0 5px 25px rgba(0,0,0,0.5);
}

.ticket-header {
  text-align:center;
  font-size:26px;
  font-weight:700;
  margin-bottom:12px;
}

.section {
  margin-top:18px;
  padding-bottom:12px;
  border-bottom:1px solid rgba(255,255,255,0.2);
}

.label {
  font-size:14px;
  opacity:.75;
}

.value {
  font-size:18px;
  font-weight:600;
}

.passenger-box {
  background: rgba(255,255,255,0.1);
  padding: 10px 14px;
  border-radius: 10px;
  margin-bottom: 10px;
}

.btn-download {
  margin-top:25px;
  width:100%;
  padding:14px;
  border:none;
  background: linear-gradient(135deg, #608cff, #71a0ff);
  border-radius:10px;
  font-size:17px;
  font-weight:600;
  cursor:pointer;
  transition:.25s;
}

.btn-download:hover {
  transform: scale(1.04);
  box-shadow:0 0 12px #71a0ff;
}
</style>
</head>

<body>
  <script type="module">
  import { auth } from "./firebase.js";
  import { onAuthStateChanged } 
    from "https://www.gstatic.com/firebasejs/10.7.0/firebase-auth.js";

  onAuthStateChanged(auth, (user) => {
    if (!user) {
      // ❌ user not logged in → send to login page
      window.location.href = "login.html";
    }
  });
</script>


<div class="ticket-card">

  <div class="ticket-header">🎫 Booking Confirmed</div>

  <div class="section">
    <div class="label">Bus Operator</div>
    <div class="value" id="opName"></div>
  </div>

  <div class="section">
    <div class="label">Route</div>
    <div class="value" id="route"></div>
  </div>

  <div class="section">
    <div class="label">Date of Journey</div>
    <div class="value" id="journeyDate"></div>
  </div>

  <div class="section">
    <div class="label">Seats</div>
    <div class="value" id="seatList"></div>
  </div>

  <div class="section">
    <div class="label">Passenger Details</div>
    <div id="passList"></div>
  </div>

  <div class="section">
    <div class="label">Total Fare</div>
    <div class="value" id="totalFare"></div>
  </div>

  <button class="btn-download" onclick="window.print()">Download / Print Ticket</button>

</div>

<script>
const bus = JSON.parse(localStorage.getItem("selectedBus"));
const seats = JSON.parse(localStorage.getItem("selectedSeats"));
const date = localStorage.getItem("searchDate");

const names = JSON.parse(localStorage.getItem("passengerNames"));
const ages = JSON.parse(localStorage.getItem("passengerAges"));
const genders = JSON.parse(localStorage.getItem("passengerGenders"));
const phones = JSON.parse(localStorage.getItem("passengerPhones"));

document.getElementById("opName").innerText = bus.operator;
document.getElementById("route").innerText = `${bus.from} → ${bus.to}`;
document.getElementById("journeyDate").innerText = date;
document.getElementById("seatList").innerText = seats.join(", ");

let passHtml = "";
for (let i = 0; i < seats.length; i++) {
  passHtml += `
    <div class="passenger-box">
      <strong>${names[i]}</strong> (${genders[i]}, ${ages[i]} yrs)<br>
      Phone: ${phones[i]}<br>
      Seat: ${seats[i]}
    </div>
  `;
}
document.getElementById("passList").innerHTML = passHtml;

document.getElementById("totalFare").innerText = "₹" + (bus.price * seats.length);
</script>

</body>
</html>
